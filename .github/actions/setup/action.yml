name: Setup
description: Install pnpm, set up Node, and install dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        run_install: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24.19.0
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
